heat_template_version: 2015-10-15

description: |
  Базовая инфраструктура для currency-converter-bot
  БЕЗ Floating IP

parameters: 
  image_id:
    type: string
    label: Image
    default: "ubuntu-22.04"
  
  flavor_id:
    type: string
    label: Flavor
    default: "m1.small"
  
  key_name:
    type: string
    label: SSH Key
    default: "Arseniy"
  
  existing_subnet_id:
    type: string
    label: Existing Subnet ID
    default: "d80da048-c188-45a5-80e4-55d914fe58ea"

resources:
  bot_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: bot-sg
      description: "SG for currency-converter-bot"
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0
        - protocol: tcp
          port_range_min: 8081
          port_range_max: 8081
          remote_ip_prefix: 0.0.0.0/0
        # ❌ Убрали egress rule — по умолчанию весь исходящий разрешён

  mongo_volume:
    type: OS::Cinder::Volume
    properties:
      name: mongo-vol
      size: 10
      description: "MongoDB data volume"
  
  rabbitmq_volume:
    type: OS::Cinder::Volume
    properties:
      name: rabbit-vol
      size: 5
      description: "RabbitMQ data volume"

  bot_server:
    type: OS::Nova::Server
    properties:
      name: bot-vm
      image: { get_param: image_id }
      flavor: { get_param: flavor_id }
      key_name: { get_param: key_name }
      networks:
        - subnet: { get_param: existing_subnet_id }
      security_groups:
        - { get_resource: bot_security_group }
      # ✅ Простой user_data без циклических ссылок
      user_data: |
        #!/bin/bash
        echo "=== currency-converter-bot init ===" >> /var/log/cloud-init-output.log
        echo "Hostname: $(hostname)" >> /var/log/cloud-init-output.log
        date >> /var/log/cloud-init-output.log

  mongo_attach:
    type: OS::Cinder::VolumeAttachment
    properties:
      instance_uuid: { get_resource: bot_server }
      volume_id: { get_resource: mongo_volume }
      mountpoint: /dev/vdb
    depends_on: bot_server  # ✅ Явная зависимость
  
  rabbit_attach:
    type: OS::Cinder::VolumeAttachment
    properties:
      instance_uuid: { get_resource: bot_server }
      volume_id: { get_resource: rabbitmq_volume }
      mountpoint: /dev/vdc
    depends_on: bot_server

outputs:
  server_private_ip:
    description: "Private IP address"
    value: { get_attr: [bot_server, first_address] }
  
  server_name:
    description: "Server name"
    value: { get_attr: [bot_server, name] }
  
  ssh_command:
    description: "SSH command (via bastion/VPN)"
    value: 
      str_replace:
        template: "ssh -i <key> ubuntu@{ip}"
        params: 
          ip: { get_attr: [bot_server, first_address] }
  
  console_url:
    description: "How to access console"
    value: "OpenStack Dashboard → Compute → Instances → bot-vm → Console"
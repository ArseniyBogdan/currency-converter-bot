heat_template_version: 2015-10-15

description: |
  Базовая инфраструктура для currency-converter-bot

parameters: 
  # --- OpenStack Resources ---
  image_id:
    type: string
    label: Image
    default: "ubuntu-22.04"
  
  flavor_id:
    type: string
    label: Flavor
    default: "m1.small"
  
  key_name:
    type: string
    label: SSH Key
    default: "Arseniy"
  
  # --- Network Configuration ---
  existing_subnet_id:
    type: string
    label: Existing Subnet ID
    description: ID подсети для VM
    default: "d80da048-c188-45a5-80e4-55d914fe58ea"

resources:
  # === Security Group ===
  bot_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: bot-sg
      description: "SG for currency-converter-bot"
      rules:
        # SSH — доступ из любой сети (для bastion/VPN)
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0
        # Приложение бота
        - protocol: tcp
          port_range_min: 8081
          port_range_max: 8081
          remote_ip_prefix: 0.0.0.0/0
        # Исходящий трафик (разрешаем весь)
        - protocol: icmp
          remote_ip_prefix: 0.0.0.0/0
          direction: egress

  # === Volumes (Persistent Storage) ===
  mongo_volume:
    type: OS::Cinder::Volume
    properties:
      name: mongo-vol
      size: 10
      description: "MongoDB data volume"
  
  rabbitmq_volume:
    type: OS::Cinder::Volume
    properties:
      name: rabbit-vol
      size: 5
      description: "RabbitMQ data volume"

  # === Virtual Machine ===
  bot_server:
    type: OS::Nova::Server
    properties:
      name: bot-vm
      image: { get_param: image_id }
      flavor: { get_param: flavor_id }
      key_name: { get_param: key_name }
      networks:
        - subnet: { get_param: existing_subnet_id }
      security_groups:
        - { get_resource: bot_security_group }
      user_data: {
        "str_replace": {
          "template": "#!/bin/bash\necho 'VM Private IP: {private_ip}'",
          "params": {
            "private_ip": { "get_attr": ["bot_server", "first_address"] }
          }
        }
      }

  # === Volume Attachments ===
  mongo_attach:
    type: OS::Cinder::VolumeAttachment
    properties:
      instance_uuid: { get_resource: bot_server }
      volume_id: { get_resource: mongo_volume }
      mountpoint: /dev/vdb
  
  rabbit_attach:
    type: OS::Cinder::VolumeAttachment
    properties:
      instance_uuid: { get_resource: bot_server }
      volume_id: { get_resource: rabbitmq_volume }
      mountpoint: /dev/vdc

outputs:
  server_private_ip:
    description: "Private IP address"
    value: { get_attr: [bot_server, first_address] }
  
  server_name:
    description: "Server name"
    value: { get_attr: [bot_server, name] }
  
  ssh_command:
    description: "SSH command (via bastion/VPN)"
    value: { 
      "str_replace": { 
        "template": "ssh -i <key> ubuntu@{ip}  # через bastion или VPN",
        "params": { "ip": { get_attr: [bot_server, first_address] } }
      }
    }
  
  console_url:
    description: "OpenStack Console URL"
    value: "Откройте OpenStack Dashboard → Instances → bot-vm → Console"
  
  volumes_info:
    description: "Attached volumes"
    value: 
      str_replace:
        template: |
          MongoDB: {mongo_vol} (10GB)
          RabbitMQ: {rabbit_vol} (5GB)
        params:
          mongo_vol: { get_resource: mongo_volume }
          rabbit_vol: { get_resource: rabbitmq_volume }
---
- name: Provision Currency Converter Bot VM
  hosts: all
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    app_user: ubuntu
    app_group: ubuntu
    app_dir: /opt/currency-converter-bot
    mongo_mount: /var/lib/mongodb
    rabbit_mount: /var/lib/rabbitmq

  tasks:
    # 1. Ожидание завершения cloud-init
    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300

    # 2. Базовые утилиты
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - unzip
          - gnupg
          - ca-certificates
          - software-properties-common
          - lsb-release
          - xfsprogs
        state: present

    # 3. Docker Engine
    - name: Remove old Docker packages
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
      ignore_errors: true

    - name: Create keyrings directory for Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg
        mode: '0644'
      register: gpg_key

    - name: Convert GPG key to binary format
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      notify: Update apt cache

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # 4. Монтирование Cinder-томов (аналог mount_volume из скрипта)
    - name: Check if MongoDB volume (/dev/vdb) is formatted
      command: blkid -s TYPE -o value /dev/vdb
      register: mongo_fs
      failed_when: false
      changed_when: false

    - name: Format MongoDB volume as ext4
      filesystem:
        fstype: ext4
        dev: /dev/vdb
      when: mongo_fs.stdout == ""

    - name: Create MongoDB mount point
      file:
        path: "{{ mongo_mount }}"
        state: directory
        mode: "0750"

    - name: Mount MongoDB volume
      mount:
        path: "{{ mongo_mount }}"
        src: /dev/vdb
        fstype: ext4
        state: mounted
        opts: defaults,nofail

    - name: Ensure mongodb system user exists
      user:
        name: mongodb
        state: present
        system: true
        shell: /usr/sbin/nologin

    - name: Set MongoDB volume ownership
      file:
        path: "{{ mongo_mount }}"
        owner: mongodb
        group: mongodb
        mode: "0750"
        state: directory

    # --- RabbitMQ Volume ---
    - name: Check if RabbitMQ volume (/dev/vdc) is formatted
      command: blkid -s TYPE -o value /dev/vdc
      register: rabbit_fs
      failed_when: false
      changed_when: false

    - name: Format RabbitMQ volume as ext4
      filesystem:
        fstype: ext4
        dev: /dev/vdc
      when: rabbit_fs.stdout == ""

    - name: Create RabbitMQ mount point
      file:
        path: "{{ rabbit_mount }}"
        state: directory
        mode: "0750"

    - name: Mount RabbitMQ volume
      mount:
        path: "{{ rabbit_mount }}"
        src: /dev/vdc
        fstype: ext4
        state: mounted
        opts: defaults,nofail

    - name: Ensure rabbitmq system user exists
      user:
        name: rabbitmq
        state: present
        system: true
        shell: /usr/sbin/nologin

    - name: Set RabbitMQ volume ownership
      file:
        path: "{{ rabbit_mount }}"
        owner: rabbitmq
        group: rabbitmq
        mode: "0750"
        state: directory

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

  handlers:
    - name: Update apt cache
      apt:
        update_cache: true
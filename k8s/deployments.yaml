apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.19
        ports:
        - containerPort: 8200
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: VAULT_TOKEN
        - name: VAULT_ADDR
          value: "http://127.0.0.1:8200"
        args: ["server", "-dev"]
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/vault-initialized"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: shared-tmp
          mountPath: /tmp
      - name: vault-init-sidecar
        image: hashicorp/vault:1.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e  # Выход при ошибке

            echo "⏳ Waiting for Vault to start..."
            sleep 10  # Даём время Vault открыть порт

            echo "🔐 Logging in to Vault..."
            export VAULT_ADDR='http://127.0.0.1:8200'
            export VAULT_TOKEN=${VAULT_TOKEN}

            echo "⏳ Waiting for Vault to be ready..."
            max_attempts=30
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if vault status -format=json > /dev/null 2>&1; then
                echo "✅ Vault is ready!"
                break
              else
                echo "Vault not ready yet (attempt $((++attempt))/$max_attempts), sleeping..."
                sleep 5
              fi
            done

            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Vault failed to become ready after $max_attempts attempts"
              exit 1
            fi

            echo "📝 Writing secrets from ConfigMap..."
            for file in /vault/data/*; do
              if [ -f "$file" ]; then
                key=$(basename $file)
                value=$(cat $file)
                echo "Setting $key = $value"
                vault kv put secret/currency-converter-bot $key="$value" || {
                  echo "⚠️ Failed to write $key, continuing..."
                }
              fi
            done

            echo "✅ Vault initialization complete."
            touch /tmp/vault-initialized
            echo "🚩 Flag file created: /tmp/vault-initialized"

            # Держим контейнер живым, чтобы pod не перезапускался
            tail -f /dev/null
        env:
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: VAULT_TOKEN
        volumeMounts:
        - name: vault-data-volume
          mountPath: /vault/data
        - name: shared-tmp
          mountPath: /tmp
      volumes:
      - name: vault-data-volume
        configMap:
          name: vault-initial-data
      - name: shared-tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_ROOT_USER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGO_ROOT_PASSWORD
        readinessProbe:
          exec:
            command: ["mongosh", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_DEFAULT_PASS
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "check_running"]
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-converter-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: <IMAGE_PLACEHOLDER> # Будет заменено Jenkins
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        # Переопределяем URI Vault, так как он зависит от имени сервиса
        env:
        - name: SPRING_CLOUD_VAULT_URI_FULL
          value: "http://vault-service:8200"
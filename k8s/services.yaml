apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
  - port: 15672
    targetPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort # Чтобы можно было зайти с хост-машины
  selector:
    app: app
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081 # Фиксированный порт для доступа извне
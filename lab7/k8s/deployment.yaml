apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-bot
  labels:
    app: currency-bot # Селектор для Service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-bot # Управляет подами с этим лейблом
  template:
    metadata:
      labels:
        app: currency-bot # Под получит этот лейбл
    spec:
      containers:
        - name: bot
          image: currency-converter-bot:latest # Docker-образ
          imagePullPolicy: Never

          ports:
            - containerPort: 8081 # Порт, который слушает приложение
              name: http
              protocol: TCP

          # Явно прописываем ВСЕ переменные.
          env:
            # --- Vault (ТОЛЬКО ХОСТ, без http:// и без порта!) ---
            - name: SPRING_CLOUD_VAULT_URI
              value: "vault"  # Имя сервиса, код добавит http:// и :порт
            - name: SPRING_CLOUD_VAULT_PORT
              value: "8200"
            - name: SPRING_CLOUD_VAULT_TOKEN
              value: "test-token"
            - name: SPRING_CLOUD_VAULT_AUTHENTICATION
              value: "TOKEN"

            # --- MongoDB ---
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://test:test@mongodb:27017/currency-bot?authSource=admin"

            # --- RabbitMQ ---
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_USERNAME
              value: "test"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "test"

          resources:
            requests: # Гарантированные ресурсы
              memory: "512Mi"
              cpu: "250m" # 0.25 ядра
            limits: # Максимальные ресурсы
              memory: "1Gi"
              cpu: "500m"